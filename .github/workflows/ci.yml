name: Validate blueprint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generator-contract:
    name: Generator contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Validate audit, blueprint, and generator edge cases
        run: npm run validate:blueprint
      - name: Test upgrade from pinned historical commits
        run: npm run check:upgrade
      - run: npm run check:upgrade-status

  validate-generated-project:
    name: Validate freshly generated project (${{ matrix.os }})
    needs: generator-contract
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: skeleton/package-lock.json
      - name: Generate, install, scaffold, test, and build
        env:
          KOI_H5_SMOKE: "1"
        run: npm run validate

  validate-upgraded-project:
    name: Validate upgraded projects (${{ matrix.os }})
    needs: generator-contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: skeleton/package-lock.json
      - run: npm run check:upgrade -- --full

  validate-example:
    name: Reference app (${{ matrix.example }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: [openapi, typed-routes, wot-form]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: skeleton/package-lock.json
      - run: npm run check:example -- ${{ matrix.example }} --h5
